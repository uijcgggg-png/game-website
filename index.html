<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARDWARE-X | منصة تقييم الألعاب وتجميعات الكمبيوتر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0c16;
            --panel-bg: rgba(18, 22, 41, 0.9);
            --accent-purple: #7c3aed;
            --accent-blue: #2563eb;
            --neon-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: rgba(124, 58, 237, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(124, 58, 237, 0.12), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.1), transparent 40%);
            background-attachment: fixed;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(10, 12, 22, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
        }

        /* Layout Container */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        /* Box Cards */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-sub);
        }

        .form-control, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(5, 7, 15, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus, select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border: none;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(124, 58, 237, 0.5);
        }

        /* Results Box */
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            display: none;
        }

        .badge-status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .status-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        .status-warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
        .status-danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

        /* Review Grid */
        .reviews-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .review-card {
            background: rgba(5, 7, 15, 0.6);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
        }

        .review-card h4 {
            color: var(--neon-cyan);
            margin-bottom: 5px;
        }

        .review-card .author {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .price-tag {
            font-size: 22px;
            font-weight: 900;
            color: var(--neon-cyan);
            margin-top: 15px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 12px; }
            .nav-tabs { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="brand">
            <i class="fa-solid fa-microchip"></i> HARDWARE-<span>X</span>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('check-tab')"><i class="fa-solid fa-gamepad"></i> فاحص الألعاب</button>
            <button class="tab-btn" onclick="switchTab('builder-tab')"><i class="fa-solid fa-desktop"></i> تجميعة الكمبيوتر</button>
            <button class="tab-btn" onclick="switchTab('reviews-tab')"><i class="fa-solid fa-comments"></i> التقييمات والآراء</button>
        </div>
    </nav>

    <div class="container">

        <!-- ================= PAGE 1: GAME CHECKER ================= -->
        <div id="check-tab" class="page-section active">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-calculator"></i> اختبار قدرة الجهاز على تشغيل الألعاب</div>
                
                <div class="form-group">
                    <label><i class="fa-solid fa-magnifying-glass"></i> اكتب اسم اللعبة (أمثلة: GTA V, Cyberpunk 2077, Minecraft, Red Dead 2, PUBG Mobile, Once Human):</label>
                    <input type="text" id="gameInput" class="form-control" placeholder="ادخل اسم اللعبة بالظبط...">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-cpu"></i> اختر المعالج (CPU):</label>
                    <select id="cpuSelect">
                        <option value="4">AMD Ryzen 5 4600G / Core i5 10400F</option>
                        <option value="5">Intel Core i5 12400F / Ryzen 5 5600</option>
                        <option value="6">Intel Core i7 13700K / Ryzen 7 7800X3D</option>
                        <option value="2">Intel Core i3 القديم / Core 2 Duo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-vr-cardboard"></i> اختر كارت الشاشة (GPU):</label>
                    <select id="gpuSelect">
                        <option value="1">مدمج (AMD Radeon Vega / Intel UHD)</option>
                        <option value="3">NVIDIA GTX 1660 Super / RX 580</option>
                        <option value="5">NVIDIA RTX 4060 / RTX 3060</option>
                        <option value="6">NVIDIA RTX 4080 / RTX 4090</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-memory"></i> حجم الرامات (RAM):</label>
                    <select id="ramSelect">
                        <option value="8">8 GB RAM</option>
                        <option value="16" selected>16 GB RAM</option>
                        <option value="32">32 GB RAM</option>
                    </select>
                </div>

                <button class="btn-action" onclick="checkGamePerformance()"><i class="fa-solid fa-bolt"></i> افحص التقييم الآن</button>

                <div id="checkResult" class="result-box">
                    <div id="statusBadge" class="badge-status"></div>
                    <h3 id="resultTitle" style="margin-bottom: 8px;"></h3>
                    <p id="resultDesc" style="color: var(--text-sub); font-size: 14px;"></p>
                </div>
            </div>
        </div>

        <!-- ================= PAGE 2: PC BUILDER ================= -->
        <div id="builder-tab" class="page-section">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-wrench"></i> تجميعة الكمبيوتر وحساب السعر المباشر</div>
                
                <div class="form-group">
                    <label>المعالج (Processor):</label>
                    <select id="buildCpu" onchange="calculateBuild()">
                        <option value="5500" data-usd="115">AMD Ryzen 5 4600G - (5,500 EGP / $115)</option>
                        <option value="6800" data-usd="140">Intel Core i5 12400F - (6,800 EGP / $140)</option>
                        <option value="7900" data-usd="165">AMD Ryzen 5 5600X - (7,900 EGP / $165)</option>
                        <option value="14500" data-usd="300">Intel Core i7 13700F - (14,500 EGP / $300)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>كارت الشاشة (Graphics Card):</label>
                    <select id="buildGpu" onchange="calculateBuild()">
                        <option value="0" data-usd="0">بدون كارت خارجي (اعتماد على المعالج المدمج)</option>
                        <option value="9500" data-usd="195">NVIDIA GTX 1660 Super 6GB - (9,500 EGP / $195)</option>
                        <option value="15500" data-usd="320">NVIDIA RTX 4060 8GB - (15,500 EGP / $320)</option>
                        <option value="24000" data-usd="500">NVIDIA RTX 4070 Super 12GB - (24,000 EGP / $500)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>اللوحة الأم (Motherboard):</label>
                    <select id="buildMobo" onchange="calculateBuild()">
                        <option value="3800" data-usd="80">Gigabyte A520M / H610M - (3,800 EGP / $80)</option>
                        <option value="5600" data-usd="115">MSI B550M PRO / B760M - (5,600 EGP / $115)</option>
                        <option value="9000" data-usd="185">ASUS TUF Gaming Z790 - (9,000 EGP / $185)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>الرامات (RAM):</label>
                    <select id="buildRam" onchange="calculateBuild()">
                        <option value="1800" data-usd="38">16GB (8x2) DDR4 3200MHz - (1,800 EGP / $38)</option>
                        <option value="3600" data-usd="75">32GB (16x2) DDR4 3200MHz - (3,600 EGP / $75)</option>
                        <option value="5200" data-usd="110">32GB (16x2) DDR5 6000MHz - (5,200 EGP / $110)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>مزود الطاقة والكيسة (Power Supply & Case):</label>
                    <select id="buildPower" onchange="calculateBuild()">
                        <option value="3200" data-usd="65">Case + 500W Power Supply 80+ - (3,200 EGP / $65)</option>
                        <option value="5000" data-usd="105">Case RGB + 650W Corsair 80+ Bronze - (5,000 EGP / $105)</option>
                        <option value="7500" data-usd="155">Case Premium + 750W Gold Modular - (7,500 EGP / $155)</option>
                    </select>
                </div>

                <div class="price-tag" id="totalPriceDisplay">
                    إجمالي التجميعة: 14,300 EGP (~ $298 USD)
                </div>
                <p id="buildEvaluation" style="text-align: center; color: var(--neon-cyan); margin-top: 10px; font-weight: 700;"></p>
            </div>
        </div>

        <!-- ================= PAGE 3: REVIEWS & FEEDBACK ================= -->
        <div id="reviews-tab" class="page-section">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-pen-to-square"></i> إضافة تقييم لعبة جديد</div>
                
                <div class="form-group">
                    <label>اسمك أو لقبك:</label>
                    <input type="text" id="reviewerName" class="form-control" placeholder="مثال: أحمد...">
                </div>

                <div class="form-group">
                    <label>اسم اللعبة:</label>
                    <input type="text" id="reviewGame" class="form-control" placeholder="مثال: Cyberpunk 2077...">
                </div>

                <div class="form-group">
                    <label>تقييمك ورأيك المباشر:</label>
                    <textarea id="reviewText" class="form-control" rows="3" placeholder="اكتب ملاحظاتك وتجربتك للعبة هنا..."></textarea>
                </div>

                <button class="btn-action" onclick="addReview()"><i class="fa-solid fa-paper-plane"></i> نشر التقييم فوراً</button>
            </div>

            <div class="card">
                <div class="card-title"><i class="fa-solid fa-list-check"></i> التقييمات المسجلة للجمهور</div>
                <div class="form-group">
                    <input type="text" id="searchReviewInput" class="form-control" onkeyup="filterReviews()" placeholder="ابحث باسم اللعبة لرؤية التقييمات الخاصة بها فقط...">
                </div>

                <div id="reviewsContainer" class="reviews-list">
                    <!-- التقييمات بتظهر هنا تلقائياً -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // داتابيز الألعاب المعتمدة والمطلوبة
        const validGames = {
            "gta v": { reqGpu: 2, reqCpu: 2, desc: "شغالة بمعدل إطارات ممتاز جداً على الإعدادات العالية." },
            "gta 5": { reqGpu: 2, reqCpu: 2, desc: "شغالة بمعدل إطارات ممتاز جداً على الإعدادات العالية." },
            "cyberpunk 2077": { reqGpu: 5, reqCpu: 5, desc: "لعبة ثقيلة وتتطلب كارت شاشة قوي مثل RTX 4060 لضمان سلاسة اللعب." },
            "minecraft": { reqGpu: 1, reqCpu: 2, desc: "شغالة بسلاسة تامة على جميع الأجهزة والمعالجات المدمجة." },
            "red dead redemption 2": { reqGpu: 4, reqCpu: 4, desc: "تحتاج إلى كارت شاشة متوسط أو قوي للحصول على 60 إطاراً ثابتاً." },
            "red dead 2": { reqGpu: 4, reqCpu: 4, desc: "تحتاج إلى كارت شاشة متوسط أو قوي للحصول على 60 إطاراً ثابتاً." },
            "pubg mobile": { reqGpu: 1, reqCpu: 2, desc: "شغالة عبر المحاكي بسلاسة عالية 60-90 FPS." },
            "once human": { reqGpu: 3, reqCpu: 4, desc: "تتطلب عالم مفتوح كارت GTX 1660 Super أو أعلى مع رامات 16GB." },
            "call of duty": { reqGpu: 4, reqCpu: 4, desc: "تحتاج كارت شاشة ورامات 16GB للعب دون تقطيع." }
        };

        // التبديل بين الصفحات
        function switchTab(tabId) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // فحص قدرة الجهاز على تشغيل اللعبة
        function checkGamePerformance() {
            const gameInput = document.getElementById('gameInput').value.trim().toLowerCase();
            const cpuVal = parseInt(document.getElementById('cpuSelect').value);
            const gpuVal = parseInt(document.getElementById('gpuSelect').value);
            const ramVal = parseInt(document.getElementById('ramSelect').value);

            const resultBox = document.getElementById('checkResult');
            const statusBadge = document.getElementById('statusBadge');
            const resultTitle = document.getElementById('resultTitle');
            const resultDesc = document.getElementById('resultDesc');

            resultBox.style.display = 'block';

            // التحقق هل اللعبة موجودة في القاعدة أم الاسم مكتوب غلط
            if (!validGames[gameInput]) {
                statusBadge.className = 'badge-status status-danger';
                statusBadge.innerText = 'عفواً: اللعبة غير مسجلة';
                resultTitle.innerText = 'لم يتم العثور على هذه اللعبة!';
                resultDesc.innerText = 'تأكد من كتابة اسم اللعبة بشكل صحيح (مثال: GTA V أو Cyberpunk 2077). لن يتم إعطاء تقييم عشوائي للحفاظ على المصداقية.';
                return;
            }

            const gameData = validGames[gameInput];

            if (gpuVal >= gameData.reqGpu && cpuVal >= gameData.reqCpu && ramVal >= 8) {
                statusBadge.className = 'badge-status status-success';
                statusBadge.innerText = 'تقييم ممتاز (Ultra / High)';
                resultTitle.innerText = 'جهازك يشغل اللعبة بأعلى كفاءة!';
                resultDesc.innerText = gameData.desc;
            } else if (gpuVal + 1 >= gameData.reqGpu && cpuVal + 1 >= gameData.reqCpu) {
                statusBadge.className = 'badge-status status-warning';
                statusBadge.innerText = 'تقييم متوسط (Medium / Low)';
                resultTitle.innerText = 'جهازك يشغل اللعبة بإعدادات متوسطة.';
                resultDesc.innerText = 'ستعمل اللعبة بشكل مقبول ولكن قد تحتاج لتقليل بعض جرافيكس اللعبة.';
            } else {
                statusBadge.className = 'badge-status status-danger';
                statusBadge.innerText = 'غير مناسبة (Unplayable)';
                resultTitle.innerText = 'جهازك أقل من المتطلبات الأدنى لهذه اللعبة.';
                resultDesc.innerText = 'قد تعاني من تقطيع شديد. يُنصح بترقية كارت الشاشة أو الرامات.';
            }
        }

        // حساب تجميعة الكمبيوتر والسعر
        function calculateBuild() {
            const cpu = document.getElementById('buildCpu');
            const gpu = document.getElementById('buildGpu');
            const mobo = document.getElementById('buildMobo');
            const ram = document.getElementById('buildRam');
            const power = document.getElementById('buildPower');

            const totalEgp = parseInt(cpu.value) + parseInt(gpu.value) + parseInt(mobo.value) + parseInt(ram.value) + parseInt(power.value);
            
            const totalUsd = parseInt(cpu.options[cpu.selectedIndex].dataset.usd) +
                             parseInt(gpu.options[gpu.selectedIndex].dataset.usd) +
                             parseInt(mobo.options[mobo.selectedIndex].dataset.usd) +
                             parseInt(ram.options[ram.selectedIndex].dataset.usd) +
                             parseInt(power.options[power.selectedIndex].dataset.usd);

            document.getElementById('totalPriceDisplay').innerText = `إجمالي التجميعة: ${totalEgp.toLocaleString()} EGP (~ $${totalUsd} USD)`;

            const evalText = document.getElementById('buildEvaluation');
            if (totalEgp > 35000) {
                evalText.innerText = 'تقييم التجميعة: تجميعة احترافية فائقة للألعاب الحديثة والـ 4K!';
            } else if (totalEgp > 20000) {
                evalText.innerText = 'تقييم التجميعة: تجميعة قوية جداً للألعاب على دقة 1080p / 2K عالية الإطارات.';
            } else {
                evalText.innerText = 'تقييم التجميعة: تجميعة اقتصادية ممتازة للألعاب الخفيفة والمتوسطة.';
            }
        }

        // إدارة التقييمات والآراء
        const initialReviews = [
            { name: "أحمد", game: "GTA V", text: "شغالة على كارت 1660 Super بأعلى جرافيكس و60 فريم ثابت." },
            { name: "محمود", game: "Cyberpunk 2077", text: "اللعبة محتاجة كارت RTX عشان تفعل تتبع الأشعة وتلعب بسلاسة." }
        ];

        function displayReviews(reviews) {
            const container = document.getElementById('reviewsContainer');
            container.innerHTML = '';
            reviews.forEach(rev => {
                const card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    <h4><i class="fa-solid fa-gamepad"></i> ${rev.game}</h4>
                    <div class="author">بواسطة: ${rev.name}</div>
                    <p style="font-size: 13px; color: #e5e7eb;">"${rev.text}"</p>
                `;
                container.appendChild(card);
            });
        }

        function addReview() {
            const name = document.getElementById('reviewerName').value.trim() || 'زائر';
            const game = document.getElementById('reviewGame').value.trim();
            const text = document.getElementById('reviewText').value.trim();

            if (!game || !text) {
                alert('يرجى كتابة اسم اللعبة وتقييمك أولاً!');
                return;
            }

            initialReviews.unshift({ name, game, text });
            displayReviews(initialReviews);

            document.getElementById('reviewGame').value = '';
            document.getElementById('reviewText').value = '';
            alert('تم إضافة تقييمك بنجاح!');
        }

        function filterReviews() {
            const query = document.getElementById('searchReviewInput').value.toLowerCase();
            const filtered = initialReviews.filter(r => r.game.toLowerCase().includes(query));
            displayReviews(filtered);
        }

        // تشغيل البداية
        calculateBuild();
        displayReviews(initialReviews);
    </script>
</body>
</html>
