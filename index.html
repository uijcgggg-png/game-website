    <style>
        :root {
            --bg-dark: #040d07;
            --card-bg: rgba(10, 25, 15, 0.85);
            --primary-green: #10b981;
            --neon-green: #00ff66;
            --border-color: rgba(0, 255, 102, 0.25);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.15), transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.08), transparent 40%);
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(4, 13, 7, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
        }

        .badge {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

            text-align: center;
            padding: 40px 15px 20px;
