<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonVault 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1f2937;
            --accent: #00f2fe;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        [data-theme="light"] {
            --bg-primary: #f3f4f6;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --accent: #0284c7;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background-color: var(--bg-secondary);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-small {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-small:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Search Section */
        .search-bar-section {
            padding: 1.5rem 1rem 0.5rem 1rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background-color: var(--bg-secondary);
            color: var(--text-main);
            outline: none;
            font-size: 1rem;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        /* Main Grid */
        main {
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .player-section {
            display: none;
            margin-bottom: 2rem;
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        .movie-title {
            font-size: 1.5rem;
            margin: 15px 0 10px 0;
        }

        .movie-story {
            color: var(--text-muted);
            line-height: 1.7;
            background: var(--bg-primary);
            padding: 15px;
            border-radius: 8px;
        }

        .back-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 1.2rem;
            border-right: 4px solid var(--accent);
            padding-right: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .movie-card:hover {
            border-color: var(--accent);
        }

        .poster-wrapper {
            width: 100%;
            height: 280px;
            overflow: hidden;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-card-info {
            padding: 12px;
        }

        .movie-card-title {
            font-size: 1rem;
            font-weight: 700;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
        }

        .modal-content button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            background-color: var(--bg-secondary);
            text-align: center;
            padding: 1.2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: auto;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showCatalog()">ToonVault</div>
        <div class="header-actions">
            <button class="btn-small" onclick="openSupportModal()">🎫 تذكرة</button>
            <button class="btn-small" onclick="toggleNotifications()">🔔</button>
            <button class="btn-small" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="search-bar-section">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن اسم الفيلم..." oninput="handleSearch()">
    </div>

    <main>
        <section id="playerSection" class="player-section">
            <button class="back-btn" onclick="showCatalog()">⬅ العودة للقائمة</button>
            <div class="video-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
            <div class="movie-details">
                <h2 id="movieTitle" class="movie-title"></h2>
                <p id="movieStory" class="movie-story"></p>
            </div>
        </section>

        <section id="catalogSection">
            <h2 class="section-title">الأفلام المتاحة</h2>
            <div id="moviesGrid" class="movies-grid"></div>
        </section>
    </main>

    <!-- Support / Owner Modal -->
    <div id="supportModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: var(--accent);">الدعم والشكاوى</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">اكتب اسمك وشكواك لفتح تذكرة. (للأونر: اكتب الباسورد في خانة الاسم).</p>
            <input type="text" id="ticketName" placeholder="الاسم (أو كلمة سر الأونر)">
            <textarea id="ticketMessage" rows="3" placeholder="اكتب رسالتك هنا..."></textarea>
            <div style="display:flex; gap:10px;">
                <button onclick="submitTicket()">إرسال</button>
                <button onclick="closeSupportModal()" style="background:#ef4444; color:#fff;">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Owner Dashboard -->
    <div id="ownerModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <h3 style="color: var(--accent);">لوحة تحكم الأونر</h3>
            <div id="ticketsList" style="max-height: 250px; overflow-y: auto; margin: 15px 0; background: var(--bg-primary); padding: 10px; border-radius: 6px;"></div>
            <button onclick="closeOwnerModal()">إغلاق</button>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notifModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: var(--accent);">الإشعارات</h3>
            <p style="margin: 15px 0; color: var(--text-muted); font-size: 0.95rem;">• تم إضافة فيلم مدغشقر الجزء الأول مدبلج بالعربي.</p>
            <button onclick="toggleNotifications()">إغلاق</button>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; ToonVault 2026</p>
    </footer>

    <script>
        const movies = [
            {
                id: 1,
                title: "فيلم مدغشقر الجزء الأول مدبلج بالعربي (Madagascar 1)",
                searchKeywords: "madagascar 1 مدغشقر الجزء الاول مدبلج اسد حمار زرافة بطاريق",
                embedUrl: "https://ok.ru/videoembed/16790743616119",
                image: "https://images.justwatch.com/poster/8655810/s718/madagascar-1.jpg",
                story: "تدور أحداث القصة حول أربعة حيوانات من حديقة حيوان سنترال بارك في نيويورك: الأسد أليكس، الزرافة ملمان، الحمار الوحشي مورتي، والفرس جلوريا. يجد الأصدقاء أنفسهم بالخطأ في صناديق وسط البحر ومنها إلى براري جزيرة مدغشقر."
            }
        ];

        let tickets = JSON.parse(localStorage.getItem('toonvault_tickets')) || [];

        function renderMovies(list) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if(list.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">لا يتوفر فيلم بهذا الاسم حالياً.</p>';
                return;
            }

            list.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie);
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${movie.image}" alt="${movie.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x280?text=ToonVault';">
                    </div>
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playMovie(movie) {
            document.getElementById('videoPlayer').src = movie.embedUrl;
            document.getElementById('movieTitle').innerText = movie.title;
            document.getElementById('movieStory').innerText = movie.story;
            document.getElementById('playerSection').style.display = 'block';
            document.getElementById('catalogSection').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCatalog() {
            document.getElementById('playerSection').style.display = 'none';
            document.getElementById('catalogSection').style.display = 'block';
            document.getElementById('videoPlayer').src = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if(!query) {
                renderMovies(movies);
                return;
            }
            const filtered = movies.filter(movie => 
                movie.title.toLowerCase().includes(query) || 
                movie.searchKeywords.toLowerCase().includes(query)
            );
            renderMovies(filtered);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            document.querySelector('.theme-toggle').innerText = newTheme === 'light' ? '☀️' : '🌙';
        }

        function openSupportModal() {
            document.getElementById('supportModal').style.display = 'flex';
        }

        function closeSupportModal() {
            document.getElementById('supportModal').style.display = 'none';
        }

        function toggleNotifications() {
            const modal = document.getElementById('notifModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function submitTicket() {
            const name = document.getElementById('ticketName').value.trim();
            const message = document.getElementById('ticketMessage').value.trim();

            if (name === 'Ahmedfox22') {
                closeSupportModal();
                openOwnerDashboard();
                document.getElementById('ticketName').value = '';
                document.getElementById('ticketMessage').value = '';
                return;
            }

            if (!name || !message) {
                alert('يرجى كتابة الاسم والرسالة أولاً!');
                return;
            }

            tickets.push({ name, message, date: new Date().toLocaleString() });
            localStorage.setItem('toonvault_tickets', JSON.stringify(tickets));
            alert('تم إرسال تذكرتك بنجاح!');
            document.getElementById('ticketName').value = '';
            document.getElementById('ticketMessage').value = '';
            closeSupportModal();
        }

        function openOwnerDashboard() {
            const listDiv = document.getElementById('ticketsList');
            listDiv.innerHTML = '';
            
            if (tickets.length === 0) {
                listDiv.innerHTML = '<p style="color: var(--text-muted); text-align:center;">لا توجد تذاكر حالياً.</p>';
            } else {
                tickets.forEach((t, index) => {
                    listDiv.innerHTML += `
                        <div style="background: var(--bg-secondary); padding: 8px; border-radius: 6px; margin-bottom: 8px; border-right: 3px solid var(--accent); font-size: 0.9rem;">
                            <b>المرسل:</b> ${t.name}<br>
                            <b>الرسالة:</b> ${t.message}<br>
                            <button onclick="deleteTicket(${index})" style="background:#ef4444; color:#fff; padding:3px 8px; font-size:0.75rem; margin-top:5px; border:none; border-radius:4px; cursor:pointer;">حذف</button>
                        </div>
                    `;
                });
            }
            document.getElementById('ownerModal').style.display = 'flex';
        }

        function closeOwnerModal() {
            document.getElementById('ownerModal').style.display = 'none';
        }

        function deleteTicket(index) {
            tickets.splice(index, 1);
            localStorage.setItem('toonvault_tickets', JSON.stringify(tickets));
            openOwnerDashboard();
        }

        renderMovies(movies);
    </script>
</body>
</html>
