<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonVault - عالم الكرتون والأنيميشن الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #070913;
            --bg-secondary: #0f1322;
            --bg-card: #161b33;
            --accent-1: #00f2fe;
            --accent-2: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --glow: rgba(0, 242, 254, 0.25);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --accent-1: #0284c7;
            --accent-2: #0ea5e9;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --glow: rgba(2, 132, 199, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Style */
        header {
            background-color: var(--bg-secondary);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 1.5px;
            filter: drop-shadow(0 0 10px var(--glow));
        }

        .search-container {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 25px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 22px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-main);
            outline: none;
            font-size: 1rem;
        }

        .search-input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 15px var(--glow);
        }

        .theme-toggle {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-main);
        }

        /* Main Container */
        main {
            padding: 2.5rem;
            max-width: 1350px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        /* Player Section */
        .player-section {
            display: none;
            margin-bottom: 3.5rem;
            background-color: var(--bg-secondary);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 14px;
            background-color: #000;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .movie-details {
            margin-top: 25px;
        }

        .movie-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .movie-story {
            color: var(--text-muted);
            line-height: 1.9;
            font-size: 1.1rem;
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 12px;
            border-right: 5px solid var(--accent-1);
        }

        .back-btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 1rem;
            box-shadow: 0 5px 15px var(--glow);
        }

        /* Catalog Grid */
        .section-title {
            font-size: 1.7rem;
            margin-bottom: 2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            border-right: 4px solid var(--accent-1);
            padding-right: 12px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .movie-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-1);
            box-shadow: 0 12px 30px var(--glow);
        }

        .poster-wrapper {
            width: 100%;
            height: 330px;
            overflow: hidden;
            position: relative;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-card:hover img {
            transform: scale(1.06);
        }
