<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل اللعبة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 26px;
            margin-bottom: 12px;
        }
        p {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Enlisted</h1>
        <p>مرحباً بك! اضغط على الزر بالأسفل لتحميل اللعبة برابط مباشر واستمتع بالتجربة.</p>
        
        <!-- استبدل # برابط تحميل اللعبة (مثل رابط Google Drive أو Mega) -->
        <a href="#" class="btn">تحميل اللعبة الآن (APK)</a>

        <div class="footer">
            جميع الحقوق محفوظة © 2026
        </div>
    </div>

</body>
</html>
