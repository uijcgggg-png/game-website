<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlisted Mobile - التحميل الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4500;
            --accent: #eab308;
            --bg: #05070a;
            --card-bg: rgba(12, 17, 29, 0.9);
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: radial-gradient(circle at 50% 10%, rgba(255, 69, 0, 0.2), transparent 60%),
                        radial-gradient(circle at 50% 90%, rgba(15, 23, 42, 0.9), #05070a);
            background-attachment: fixed;
        }

        .main-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 69, 0, 0.3);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 69, 0, 0.25), 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        .hero-header {
            position: relative;
            height: 230px;
            overflow: hidden;
        }

        .hero-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(12, 17, 29, 1) 0%, rgba(12, 17, 29, 0.3) 60%, transparent 100%);
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 900;
            text-shadow: 0 0 5px var(--primary);
        }

        .content {
            padding: 20px 24px;
        }

        .game-title {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .game-desc {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .spec-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 5px;
            border-radius: 14px;
            text-align: center;
        }

        .spec-label {
            font-size: 10.5px;
            color: #64748b;
            display: block;
        }

        .spec-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 10px;
        }

        .gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .gallery::-webkit-scrollbar {
            height: 4px;
        }

        .gallery::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .gallery img {
            width: 140px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }

        .audio-player {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .audio-info {
            font-size: 12px;
            color: #cbd5e1;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4500 0%, #ff6b00 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 900;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(255, 69, 0, 0.5);
            transition: all 0.2s ease;
        }

        .download-btn:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #475569;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="hero-header">
            <span class="badge">الأندرويد 10+</span>
            <!-- صورة الغلاف السوفيتية -->
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" alt="Enlisted Banner">
            <div class="hero-overlay"></div>
        </div>

        <div class="content">
            <h1 class="game-title">ENLISTED MOBILE</h1>
            <p class="game-desc">خوض معارك الحرب العالمية الثانية برسمات واقعية خارقة وحروب فصائل ضخمة على هاتفك المحمول.</p>

            <!-- المواصفات المطلوبة -->
            <div class="specs-grid">
                <div class="spec-box">
                    <span class="spec-label">المساحة</span>
                    <span class="spec-value">4 GB</span>
                </div>
                <div class="spec-box">
                    <span class="spec-label">الرام المطلوب</span>
                    <span class="spec-value">6 GB</span>
                </div>
                <div class="spec-box">
                    <span class="spec-label">النظام</span>
                    <span class="spec-value">Android 10+</span>
                </div>
            </div>

            <!-- الموسيقى الحماسية -->
            <div class="audio-player">
                <span class="audio-info">🎵 موسيقى المعركة (Epic Theme)</span>
                <audio controls style="height: 30px; width: 160px;">
                    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                </audio>
            </div>

            <!-- لقطات الشاشة من اللعبة -->
            <div class="section-title">لقطات حية من الجيم بلاي:</div>
            <div class="gallery">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=400&q=80" alt="Battlefield Ground">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=400&q=80" alt="Winter Assault">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80" alt="Weapon View">
            </div>

            <!-- زر التحميل المباشر -->
            <a href="#" class="download-btn">
                <span>🔥 تحميل اللعبة (APK)</span>
            </a>

            <div class="footer">
                الإصدار الرسمي © 2026 | Enlisted Mobile Project
            </div>
        </div>
    </div>

</body>
</html>
