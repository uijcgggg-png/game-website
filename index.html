<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonVault - عالم الكرتون والأنيميشن</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #070913;
            --bg-secondary: #0f1322;
            --bg-card: #161b33;
            --accent-1: #00f2fe;
            --accent-2: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --glow: rgba(0, 242, 254, 0.25);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --accent-1: #0284c7;
            --accent-2: #0ea5e9;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --glow: rgba(2, 132, 199, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        .search-container {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 25px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-main);
            outline: none;
            font-size: 1rem;
        }

        .search-input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 15px var(--glow);
        }

        .theme-toggle {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-main);
        }

        main {
            padding: 2.5rem;
            max-width: 1350px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .player-section {
            display: none;
            margin-bottom: 3.5rem;
            background-color: var(--bg-secondary);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 14px;
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .movie-details {
            margin-top: 25px;
        }

        .movie-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .movie-story {
            color: var(--text-muted);
            line-height: 1.9;
            font-size: 1.05rem;
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 12px;
            border-right: 5px solid var(--accent-1);
        }

        .back-btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .section-title {
            font-size: 1.6rem;
            margin-bottom: 2rem;
            font-weight: 900;
            border-right: 4px solid var(--accent-1);
            padding-right: 12px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .movie-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-1);
            box-shadow: 0 12px 30px var(--glow);
        }

        .poster-wrapper {
            width: 100%;
            height: 320px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent-1);
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }

        .movie-card-info {
            padding: 18px;
        }

        .movie-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .movie-badge {
            font-size: 0.85rem;
            color: var(--accent-1);
            font-weight: bold;
        }

        .not-found-container {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }

        .request-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
        }

        footer {
            background-color: var(--bg-secondary);
            text-align: center;
            padding: 1.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showCatalog()">ToonVault</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلمك المفضل..." oninput="handleSearch()">
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <main>
        <section id="playerSection" class="player-section">
            <button class="back-btn" onclick="showCatalog()">⬅ العودة لقائمة الأفلام</button>
            <div class="video-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
            <div class="movie-details">
                <h2 id="movieTitle" class="movie-title"></h2>
                <p id="movieStory" class="movie-story"></p>
            </div>
        </section>

        <section id="catalogSection">
            <h2 class="section-title">🎬 أحدث الأفلام والكرتون المدبلج</h2>
            <div id="moviesGrid" class="movies-grid"></div>
        </section>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; ToonVault 2026</p>
    </footer>

    <script>
        const movies = [
            {
                id: 1,
                title: "فيلم مدغشقر الجزء الأول مدبلج بالعربي (Madagascar 1)",
                badge: "مدبلج رسمي • جودة عالية",
                searchKeywords: "madagascar 1 مدغشقر الجزء الاول مدبلج اسد حمار زرافة بطاريق",
                embedUrl: "https://ok.ru/videoembed/16790743616119",
                story: "تدور أحداث القصة في جو مليء بالكوميديا والمغامرة حول أربعة حيوانات من حديقة حيوان سنترال بارك في نيويورك: الأسد أليكس، الزرافة ملمان، الحمار الوحشي مورتي، والفرس جلوريا. يجدون أنفسهم بالخطأ في صناديق وسط البحر ومنها إلى براري جزيرة مدغشقر المتوحشة، حيث يتعرفون على ملك الليمور ويحاولون التكيف مع الحياة البرية."
            }
        ];

        function renderMovies(list, query = "") {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if(list.length === 0) {
                grid.innerHTML = `
                    <div class="not-found-container">
                        <h3>عذراً، لا يتوفر فيلم باسم "${query}"</h3>
                        <p>لم نجد أي نتائج مطابقة لبحثك.</p>
                        <button class="request-btn" onclick="alert('تم إرسال طلبك بنجاح!')">لم تجد الفيلم المطلوب؟ اضغط هنا لطلبه</button>
                    </div>
                `;
                return;
            }

            list.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie);
                card.innerHTML = `
                    <div class="poster-wrapper">
                        🎬<br>${movie.title}
                    </div>
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                        <div class="movie-badge">${movie.badge}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playMovie(movie) {
            document.getElementById('videoPlayer').src = movie.embedUrl;
            document.getElementById('movieTitle').innerText = movie.title;
            document.getElementById('movieStory').innerText = movie.story;
            document.getElementById('playerSection').style.display = 'block';
            document.getElementById('catalogSection').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCatalog() {
            document.getElementById('playerSection').style.display = 'none';
            document.getElementById('catalogSection').style.display = 'block';
            document.getElementById('videoPlayer').src = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if(!query) {
                renderMovies(movies);
                return;
            }

            const filtered = movies.filter(movie => {
                const fullText = (movie.title + " " + movie.searchKeywords).toLowerCase();
                return fullText.includes(query);
            });

            renderMovies(filtered, query);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            document.querySelector('.theme-toggle').innerText = newTheme === 'light' ? '☀️' : '🌙';
        }

        renderMovies(movies);
    </script>
</body>
</html>
