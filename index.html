<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonVault - عالم الكرتون</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0712;
            --bg-secondary: #140f24;
            --bg-card: #1c1533;
            --accent: #9d4edf;
            --accent-glow: rgba(157, 78, 223, 0.4);
            --text-main: #ffffff;
            --text-muted: #a0a0c0;
            --border: #2a2048;
        }

        [data-theme="light"] {
            --bg-primary: #f0ebf8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --accent: #7b2cbf;
            --accent-glow: rgba(123, 44, 191, 0.2);
            --text-main: #1a0c2e;
            --text-muted: #6b5b82;
            --border: #e0d5f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            background-color: var(--bg-secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .search-container {
            flex-grow: 1;
            max-width: 450px;
            margin: 0 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .theme-toggle {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-main);
        }

        /* Container */
        main {
            padding: 2rem;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        /* Video Player Section */
        .player-section {
            display: none;
            margin-bottom: 3rem;
            background-color: var(--bg-secondary);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .movie-details {
            margin-top: 20px;
        }

        .movie-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .movie-story {
            color: var(--text-muted);
            line-height: 1.8;
            font-size: 1.05rem;
            background: var(--bg-primary);
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid var(--accent);
        }

        /* Section Header */
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Movies Grid */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background-color: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        .poster-wrapper {
            width: 100%;
            height: 310px;
            overflow: hidden;
            position: relative;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-card:hover img {
            transform: scale(1.05);
        }

        .movie-card-info {
            padding: 15px;
        }

        .movie-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        footer {
            background-color: var(--bg-secondary);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="showCatalog()">ToonVault</a>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلمك المفضل..." oninput="handleSearch()">
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <main>
        <section id="playerSection" class="player-section">
            <div class="video-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
            <div class="movie-details">
                <h2 id="movieTitle" class="movie-title"></h2>
                <p id="movieStory" class="movie-story"></p>
            </div>
        </section>

        <section id="catalogSection">
            <h2 class="section-title">🎬 أحدث الأفلام والكرتون</h2>
            <div id="moviesGrid" class="movies-grid"></div>
        </section>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; ToonVault 2026</p>
    </footer>

    <script>
        const movies = [
            {
                id: 1,
                title: "مدغشقر - الجزء الأول (Madagascar 1)",
                searchKeywords: "madagascar 1 مدغشقر الاول مدغشقر1 كرتون اسد حمار زرافة",
                embedUrl: "https://ok.ru/videoembed/16790743616119",
                image: "https://m.media-amazon.com/images/M/MVBMTYwOTI5NTkyN15BMl5BanBnXkFtZTcwNDU1MTcyMQ@@._V1_FMjpg_UX1000_.jpg",
                story: "تدور الأحداث حول أربعة حيوانات من حديقة حيوان سنترال بارك في نيويورك (الأسد أليكس، الزرافة ملمان، الحمار الوحشي مورتي، والخرتيت/فرس النهر جلوريا) يجدون أنفسهم بالخطأ في براري جزيرة مدغشقر، ويحاولون التكيف مع الحياة الطبيعية والهروب بمساعدة مجموعة بطاريق مغامرة."
            }
        ];

        function renderMovies(list) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            if(list.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">عذراً، لم نجد أي فيلم بهذا الاسم.</p>';
                return;
            }
            list.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie);
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${movie.image}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playMovie(movie) {
            document.getElementById('videoPlayer').src = movie.embedUrl;
            document.getElementById('movieTitle').innerText = movie.title;
            document.getElementById('movieStory').innerText = movie.story;
            document.getElementById('playerSection').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCatalog() {
            document.getElementById('playerSection').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = movies.filter(movie => 
                movie.title.toLowerCase().includes(query) || 
                movie.searchKeywords.toLowerCase().includes(query)
            );
            renderMovies(filtered);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            document.querySelector('.theme-toggle').innerText = newTheme === 'light' ? '☀️' : '🌙';
        }

        // Display initial catalog
        renderMovies(movies);
    </script>
</body>
</html>
