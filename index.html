<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlisted Mobile - التحميل الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b00;
            --secondary: #00e5ff;
            --bg: #080b10;
            --card-bg: rgba(15, 23, 42, 0.85);
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 107, 0, 0.25), transparent 70%),
                radial-gradient(circle at 50% 120%, rgba(0, 229, 255, 0.15), transparent 70%);
            background-attachment: fixed;
        }

        .main-card {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 107, 0, 0.1);
        }

        .banner-container {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(0deg, #0f172a 0%, rgba(15, 23, 42, 0.4) 50%, transparent 100%);
        }

        .tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .content {
            padding: 24px;
        }

        .game-title {
            font-size: 30px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .game-desc {
            color: #94a3b8;
            font-size: 13.5px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-title {
            font-size: 11px;
            color: #64748b;
            display: block;
        }

        .stat-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--secondary);
        }

        .gallery-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        .gallery {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .gallery::-webkit-scrollbar {
            height: 4px;
        }

        .gallery::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .gallery img {
            width: 120px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #475569;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="banner-container">
            <span class="tag">إصدار الهواتف 2026</span>
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" class="banner-img" alt="Enlisted Banner">
            <div class="banner-overlay"></div>
        </div>

        <div class="content">
            <h1 class="game-title">ENLISTED MOBILE</h1>
            <p class="game-desc">خوض تجربة الحروب الواقعية وحروب الفصائل في ساحات قتال ضخمة على هاتفك المحمول بكفاءة عالية.</p>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-title">الحجم</span>
                    <span class="stat-value">2.4 GB</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title">الأندرويد</span>
                    <span class="stat-value">8.0+</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title">الرام</span>
                    <span class="stat-value">4 GB+</span>
                </div>
            </div>

            <div class="gallery-title">لقطات من اللعبة:</div>
            <div class="gallery">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=300&q=80" alt="Screen 1">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=300&q=80" alt="Screen 2">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=300&q=80" alt="Screen 3">
            </div>

            <!-- استبدل علامة # برابط التحميل من جوجل درايف -->
            <a href="#" class="download-btn">
                <span>⚡ تحميل اللعبة الآن (APK)</span>
            </a>

            <div class="footer-note">
                جميع الحقوق محفوظة © 2026 | النسخة المباشرة
            </div>
        </div>
    </div>

</body>
</html>
