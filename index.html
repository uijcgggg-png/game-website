<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonVault - تون فولت</title>
    <style>
        :root {
            --bg-primary: #0f0c1b;
            --bg-secondary: #1a1528;
            --accent-purple: #8a2be2;
            --accent-hover: #9d4edf;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --card-bg: #241b35;
        }

        [data-theme="light"] {
            --bg-primary: #f4f0fa;
            --bg-secondary: #ffffff;
            --accent-purple: #7b2cbf;
            --accent-hover: #9d4edf;
            --text-main: #10002b;
            --text-sub: #5a189a;
            --card-bg: #e0aaff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-purple);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 2px solid var(--accent-purple);
            background-color: var(--bg-primary);
            color: var(--text-main);
            outline: none;
            font-size: 1rem;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-main);
        }

        main {
            padding: 2rem;
            flex-grow: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .player-section {
            display: none;
            margin-bottom: 2rem;
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .movie-title {
            margin-top: 15px;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .movie-story {
            margin-top: 10px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.4);
        }

        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .movie-card-info {
            padding: 15px;
        }

        .movie-card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        footer {
            background-color: var(--bg-secondary);
            text-align: center;
            padding: 1rem;
            color: var(--text-sub);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="showCatalog()">ToonVault</a>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلم..." oninput="handleSearch()">
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <main>
        <section id="playerSection" class="player-section">
            <div class="video-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
            <h2 id="movieTitle" class="movie-title"></h2>
            <p id="movieStory" class="movie-story"></p>
        </section>

        <section id="catalogSection">
            <h2 style="margin-bottom: 20px;">الأفلام المتاحة</h2>
            <div id="moviesGrid" class="movies-grid"></div>
        </section>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; ToonVault 2026</p>
    </footer>

    <script>
        const movies = [
            {
                id: 1,
                title: "مدغشقر - الجزء الأول (Madagascar 1)",
                searchKeywords: "madagascar 1 مدغشقر الاول مدغشقر1",
                embedUrl: "https://ok.ru/videoembed/16790743616119",
                image: "https://via.placeholder.com/200x280?text=Madagascar+1",
                story: "يدور الجزء الأول حول أربعة حيوانات من حديقة حيوان سنترال بارك في نيويورك يجدون أنفسهم بالخطأ في براري جزيرة مدغشقر، ويحاولون التكيف مع الحياة الطبيعية والهروب بمساعدة البطاريق."
            }
        ];

        function renderMovies(list) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            if(list.length === 0) {
                grid.innerHTML = '<p>لا توجد نتائج بحث مطابقة.</p>';
                return;
            }
            list.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie);
                card.innerHTML = `
                    <img src="${movie.image}" alt="${movie.title}">
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playMovie(movie) {
            document.getElementById('videoPlayer').src = movie.embedUrl;
            document.getElementById('movieTitle').innerText = movie.title;
            document.getElementById('movieStory').innerText = movie.story;
            document.getElementById('playerSection').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCatalog() {
            document.getElementById('playerSection').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = movies.filter(movie => 
                movie.title.toLowerCase().includes(query) || 
                movie.searchKeywords.toLowerCase().includes(query)
            );
            renderMovies(filtered);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            document.querySelector('.theme-toggle').innerText = newTheme === 'light' ? '☀️' : '🌙';
        }

        // Display initial catalog
        renderMovies(movies);
    </script>
</body>
</html>
